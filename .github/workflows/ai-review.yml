name: AI review

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Obolduy/hexlet-task-manager-infra/review-action@main
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          search-url: http://localhost:8000
          model: anthropic/claude-sonnet-4.5